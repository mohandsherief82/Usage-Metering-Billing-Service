# Local Postgres for development — matches .env.example's DATABASE_URL
# (postgresql+psycopg://billing:billing@localhost:5432/billing) exactly,
# so `docker compose up -d` + `alembic upgrade head` + `python scripts/seed_db.py`
# is the whole setup. SQLite remains the zero-setup fallback if you'd
# rather not run Docker at all — see .env.example.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: billing
    ports:
      - "5432:5432"
    volumes:
      - billing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  billing_pgdata:
